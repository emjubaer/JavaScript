<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        font-family: arial, sans-serif;
        padding: 50px;
        background-color: beige;
      }
      .password-wrapper {
        position: relative;
        width: 320px;
      }
      .password-wrapper input {
        width: 100%;
        height: 40px;
        padding: 0 50px 0 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
      }
      .password-wrapper input:focus {
        border-color: #007bff;
      }
      .eye-icon {
        position: absolute;
        right: 20px;
        font-size: 22px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        user-select: none;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h2>Click and Hold to Show Password</h2>

    <input type="password" id="myPassword" placeholder="Enter Your Password" />
    <button
      onmousedown="document.getElementById('myPassword').type = 'text'"
      ;
      onmouseup="document.getElementById('myPassword').type = 'password'"
      ;
      onmouseleave="document.getElementById('myPassword').type = 'password'"
    >
      Show
    </button>

    <h2>Second Design for Click and Hold to Show Password</h2>

    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Enter Your Password" />
      <span
        class="eye-icon"
        onmousedown="showPassword()"
        onmouseup="hidePassword()"
        onmouseleave="hidePassword()"
      >
        👁
      </span>
    </div>

    <script>
      function showPassword() {
        document.getElementById("password").type = "text";
      }
      function hidePassword() {
        document.getElementById("password").type = "password";
      }
    </script>
  </body>
</html>
