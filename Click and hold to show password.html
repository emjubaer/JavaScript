<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Click and Hold to Show Password</h2>

    <input type="password" id="myPassword" placeholder="Enter Your Password">
    <button 
         onmousedown = "document.getElementById('myPassword').type = 'text' ";
         onmouseup = "document.getElementById('myPassword').type = 'password' ";
         onmouseleave = "document.getElementById('myPassword').type = 'password' ">
         Show
    </button>

</body>
</html>
