<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password hide & show</title>
</head>
<body>
    <h2>Click to show/hide Password</h2>

    <input id="myPassword" type="password" placeholder="Enter Password">
    <button onclick="togglePasswords()" >Show Password</button>


    <Script>
        function togglePasswords(){
            let passInput = document.getElementById('myPassword');
            let btn = document.querySelector('button');

            if (passInput.type === 'password'){
                passInput.type = 'text';
                btn.innerHTML = 'Hide Password';
            }
            else{
                passInput.type = "password";
                btn.innerHTML = 'Show Password';
            }
        }
    </Script>


    
</body>
</html>
